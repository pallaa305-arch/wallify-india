<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallify India — Beautiful Live Wallpapers (Dynamic)</title>
<meta name="description" content="Generate stunning HD wallpapers live: clean aesthetic gradients, soft generative art, and photo-style renders. Pure black base. Free download.">
<meta name="keywords" content="beautiful wallpaper, aesthetic gradient, phone wallpaper, live wallpaper maker, black wallpaper, generative art, free wallpaper download">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>p5.disableFriendlyErrors = true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>
  :root{
    --bg:#000;--panel:#0a0a0a;--line:#1c1c1c;--txt:#fff;--mut:#777;
    --accent:#00d4aa;--accent2:#ff8a00;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:#fff;font-family:'Inter',system-ui,sans-serif;overflow-x:hidden}
  h1,h2,h3,.logo{font-family:'Space Grotesk',sans-serif}
  a{color:inherit;text-decoration:none}
  nav{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;position:sticky;top:0;z-index:30;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .logo{font-size:1.35rem;font-weight:700;display:flex;align-items:center;gap:8px}
  .logo .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .stage{max-width:520px;margin:26px auto 0;padding:0 16px}
  .canvas-wrap{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:9/16;box-shadow:0 20px 60px rgba(0,0,0,.8)}
  .canvas-wrap canvas{display:block;width:100%!important;height:100%!important}
  .seedtag{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:5px 12px;border-radius:20px;font-size:.72rem;color:var(--accent);border:1px solid #222;z-index:5}
  .controls{max-width:520px;margin:18px auto;padding:0 16px;display:flex;flex-direction:column;gap:14px}
  .cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .cats button{padding:9px 15px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer;font-size:.82rem;transition:.16s}
  .cats button.active,.cats button:hover{border-color:var(--accent);color:var(--accent)}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{padding:13px 22px;border-radius:12px;border:none;font-weight:700;font-size:.93rem;cursor:pointer;transition:.18s;font-family:'Inter'}
  .btn.gen{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000}
  .btn.gen:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(255,138,0,.3)}
  .btn.dl{background:#111;color:#fff;border:1px solid #333}
  .btn.dl:hover{border-color:var(--accent);color:var(--accent)}
  .hint{text-align:center;color:var(--mut);font-size:.8rem;margin-top:4px}
  .ad{text-align:center;margin:30px auto;max-width:1100px;padding:18px;background:#0a0a0a;border:1px dashed #222;border-radius:12px;color:#555;font-size:.8rem}
  footer{text-align:center;padding:40px 20px;color:#555;font-size:.83rem;border-top:1px solid var(--line);margin-top:30px}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<nav>
  <div class="logo"><span class="dot"></span>Wallify<span style="color:var(--accent)">India</span></div>
  <div style="color:var(--mut);font-size:.85rem">⚡ Live Generative Engine</div>
</nav>

<div class="stage">
  <div class="canvas-wrap">
    <div class="seedtag" id="seedtag">seed: —</div>
    <div id="p5holder"></div>
  </div>
</div>

<div class="controls">
  <div class="cats" id="cats">
    <button class="active" data-cat="aesthetic">Aesthetic</button>
    <button data-cat="aurora">Aurora</button>
    <button data-cat="soft">Soft Gen</button>
    <button data-cat="mesh">Mesh</button>
    <button data-cat="photo">Photo-style</button>
    <button data-cat="bloom">Bloom</button>
    <button data-cat="waves">Waves</button>
  </div>
  <div class="actions">
    <button class="btn gen" onclick="newSeed()">⚡ Generate New</button>
    <button class="btn dl" onclick="downloadPNG()">⬇ Download HD</button>
    <button class="btn dl" onclick="saveToGallery()">★ Save</button>
  </div>
  <div class="hint">Clean · Beautiful · Pure black base · mobile 1080×1920 · har generate par unique</div>
</div>

<div class="ad">[ Advertisement — AdSense auto-ads ]</div>
<div class="ad">[ Advertisement — AdSense auto-ads ]</div>

<footer>
  <p>© 2026 Wallify India · Live generative wallpapers, free forever</p>
  <p>Made in Bharat for Bharat 🇮🇳</p>
</footer>

<script>
const W = 1080, H = 1920;
let CFG = { seed: Math.floor(Math.random()*999999), cat: 'aesthetic' };
const SEEDTAG = document.getElementById('seedtag');

function newSeed(){ CFG.seed = Math.floor(Math.random()*9999999); redrawLive(); }
function setCat(c){ CFG.cat = c; redrawLive(); }
function redrawLive(){
  SEEDTAG.textContent = 'seed: ' + CFG.seed;
  if(window._p5 && window._p5.redraw) window._p5.redraw();
}
document.querySelectorAll('#cats button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#cats button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); setCat(b.dataset.cat);
});

const sketch = (p) => {
  p.setup = () => {
    const c = p.createCanvas(W, H); c.parent('p5holder');
    p.pixelDensity(1); p.noLoop(); window._p5 = p; redrawLive();
  };
  p.draw = () => renderScene(p);
};
new p5(sketch);

function renderScene(p){
  p.randomSeed(CFG.seed); p.noiseSeed(CFG.seed);
  p.colorMode(p.RGB, 255);
  p.background(0);
  const cat = CFG.cat;
  if(cat==='aesthetic') aesthetic(p);
  else if(cat==='aurora') aurora(p);
  else if(cat==='soft') softGen(p);
  else if(cat==='mesh') mesh(p);
  else if(cat==='photo') photoStyle(p);
  else if(cat==='bloom') bloom(p);
  else if(cat==='waves') waves(p);
}

// ===== 1. CLEAN AESTHETIC GRADIENT (diagonal, smooth, soft glow) =====
function aesthetic(p){
  const pal = AESTHETIC[CFG.seed % AESTHETIC.length];
  const g = p.createGraphics(W,H);
  g.noStroke();
  for(let y=0;y<H;y++){
    const t = y/H;
    const r = lerp(p, pal[0][0], pal[1][0], t);
    const gg = lerp(p, pal[0][1], pal[1][1], t);
    const b = lerp(p, pal[0][2], pal[1][2], t);
    g.fill(r,gg,b); g.rect(0,y,W,1);
  }
  // soft glow blob top-right
  const gx = W*0.7, gy = H*0.22;
  for(let i=0;i<80;i++){
    g.fill(pal[2][0],pal[2][1],pal[2][2], 2.2);
    g.ellipse(gx, gy, 620-i*7, 620-i*7);
  }
  p.image(g,0,0);
  // subtle grain
  grain(p, 10);
}

// ===== 2. AURORA (soft flowing bands, dark base) =====
function aurora(p){
  p.noStroke();
  for(let i=0;i<140;i++){
    const t = i/140;
    const y = t*H;
    const col = auroraColor(p, t);
    p.fill(col[0], col[1], col[2], 5);
    p.beginShape();
    for(let x=0;x<=W;x+=20){
      const yy = y + p.sin(x*0.004 + CFG.seed + i*0.05)*60 + p.noise(x*0.003, i*0.1)*100;
      p.vertex(x, yy);
    }
    p.vertex(W, H); p.vertex(0, H); p.endShape(p.CLOSE);
  }
}
function auroraColor(p, t){
  const sets = [[0,212,170],[124,58,237],[0,102,255],[255,0,170],[0,255,231]];
  const a = sets[CFG.seed % sets.length];
  const b = sets[(CFG.seed+2) % sets.length];
  return [lerp(p,a[0],b[0],t), lerp(p,a[1],b[1],t), lerp(p,a[2],b[2],t)];
}

// ===== 3. SOFT GENERATIVE (gentle flow, low opacity, calm) =====
function softGen(p){
  const pal = SOFT[CFG.seed % SOFT.length];
  p.strokeWeight(1.4);
  for(let n=0;n<900;n++){
    let x=p.random(W), y=p.random(H);
    const c = p.lerpColor(p.color(pal[0]), p.color(pal[1]), p.random());
    p.stroke(c.levels[0],c.levels[1],c.levels[2], 26);
    for(let s=0;s<18;s++){
      const a = p.noise(x*0.0022, y*0.0022, CFG.seed*0.02)*p.TWO_PI*2;
      const nx=x+Math.cos(a)*7, ny=y+Math.sin(a)*7;
      p.line(x,y,nx,ny); x=nx; y=ny;
      if(x<0||x>W||y<0||y>H) break;
    }
  }
}

// ===== 4. MESH GRADIENT (multi radial, premium) =====
function mesh(p){
  const pal = MESH[CFG.seed % MESH.length];
  const g = p.createGraphics(W,H); g.noStroke();
  g.background(0);
  const pts = [[0.2,0.25],[0.8,0.3],[0.5,0.7],[0.25,0.85],[0.8,0.8]];
  for(let layer=0;layer<5;layer++){
    const c = pal[layer % pal.length];
    const [fx,fy] = pts[layer];
    // blur via stacked ellipses
    for(let i=0;i<70;i++){
      g.fill(c[0],c[1],c[2], 3);
      g.ellipse(fx*W, fy*H, 760-i*10, 760-i*10);
    }
  }
  p.image(g,0,0);
  p.blendMode(p.SCREEN);
  p.noStroke();
  p.fill(255,255,255,8); p.rect(0,0,W,H);
  p.blendMode(p.BLEND);
  grain(p, 8);
}

// ===== 5. PHOTO-STYLE (mountains/lake silhouette, dusk) =====
function photoStyle(p){
  const pal = PHOTO[CFG.seed % PHOTO.length];
  // sky gradient
  for(let y=0;y<H*0.62;y++){
    const t=y/(H*0.62);
    p.stroke(lerp(p,pal[0][0],pal[1][0],t), lerp(p,pal[0][1],pal[1][1],t), lerp(p,pal[0][2],pal[1][2],t));
    p.line(0,y,W,y);
  }
  // sun
  p.noStroke();
  const sx=W*0.5, sy=H*0.42;
  for(let i=0;i<60;i++){ p.fill(pal[2][0],pal[2][1],pal[2][2], 3); p.ellipse(sx,sy, 360-i*5, 360-i*5); }
  // mountains
  p.fill(pal[3][0],pal[3][1],pal[3][2]);
  p.beginShape(); p.vertex(0,H*0.62);
  let mx=0;
  while(mx<W){ const h=H*0.62 + p.random(-90,90); p.vertex(mx, h); mx+= W/8; }
  p.vertex(W,H); p.vertex(0,H); p.endShape(p.CLOSE);
  // reflection
  p.fill(pal[3][0]*0.5,pal[3][1]*0.5,pal[3][2]*0.5, 120);
  p.rect(0,H*0.62,W,H*0.38);
}

// ===== 6. BLOOM (soft bokeh circles, dark) =====
function bloom(p){
  const pal = BLOOM[CFG.seed % BLOOM.length];
  for(let i=0;i<70;i++){
    const x=p.random(W), y=p.random(H), r=p.random(30,200);
    const c = pal[CFG.seed % pal.length];
    for(let j=0;j<24;j++){
      p.fill(c[0],c[1],c[2], 4);
      p.ellipse(x,y, r-j*2, r-j*2);
    }
  }
}

// ===== 7. WAVES (smooth ribbons) =====
function waves(p){
  const pal = WAVE[CFG.seed % WAVE.length];
  p.noFill();
  for(let i=0;i<36;i++){
    const c = pal[i % pal.length];
    p.stroke(c[0],c[1],c[2], 160);
    p.strokeWeight(2.4);
    p.beginShape();
    for(let x=0;x<=W;x+=10){
      const y = i*52 + p.sin(x*0.005 + i*0.35 + CFG.seed*0.01)*80 + p.noise(x*0.004,i*0.2)*60;
      p.vertex(x,y);
    }
    p.endShape();
  }
}

// ===== helpers =====
function lerp(p,a,b,t){ return a+(b-a)*t; }
function grain(p, amt){
  p.loadPixels();
  for(let i=0;i<p.pixels.length;i+=4){
    const n=(Math.random()-0.5)*amt;
    p.pixels[i]+=n; p.pixels[i+1]+=n; p.pixels[i+2]+=n;
  }
  p.updatePixels();
}

// ===== palettes (clean, phone-friendly) =====
const AESTHETIC = [
  [[255,138,0],[255,45,126],[255,210,120]],
  [[0,212,170],[0,102,255],[120,255,230]],
  [[124,58,237],[219,39,119],[200,140,255]],
  [[245,158,11],[239,68,68],[255,220,150]],
  [[6,182,212],[59,130,246],[180,240,255]],
  [[236,72,153],[139,92,246],[255,180,230]],
  [[16,185,129],[5,150,105],[140,255,210]],
  [[99,102,241],[236,72,153],[190,200,255]]
];
const SOFT = [
  [[0,212,170],[0,102,255]],
  [[255,138,0],[255,45,126]],
  [[124,58,237],[236,72,153]],
  [[16,185,129],[45,212,191]],
  [[59,130,246],[99,102,241]]
];
const MESH = [
  [[0,212,170],[0,102,255],[124,58,237],[255,45,126],[255,210,120]],
  [[255,138,0],[255,45,126],[124,58,237],[0,212,170],[59,130,246]],
  [[236,72,153],[139,92,246],[0,255,231],[255,138,0],[99,102,241]]
];
const PHOTO = [
  [[255,180,120],[120,80,160],[255,230,180],[20,16,40]],
  [[120,180,255],[40,80,140],[255,240,200],[10,20,40]],
  [[255,140,100],[100,60,120],[255,220,160],[15,12,30]]
];
const BLOOM = [
  [[0,212,170],[255,138,0],[124,58,237]],
  [[255,45,126],[0,255,231],[255,210,120]],
  [[99,102,241],[236,72,153],[16,185,129]]
];
const WAVE = [
  [[0,212,170],[0,102,255],[120,255,230]],
  [[255,138,0],[255,45,126],[255,210,120]],
  [[124,58,237],[236,72,153],[200,140,255]]
];

// ===== actions =====
function downloadPNG(){ if(window._p5) window._p5.saveCanvas('wallify_'+CFG.cat+'_'+CFG.seed,'png'); }
let savedCount=0;
function saveToGallery(){
  const cv=document.querySelector('#p5holder canvas'); if(!cv) return;
  const url=cv.toDataURL('image/png');
  const grid=document.getElementById('saved');
  if(savedCount===0) grid.innerHTML='';
  const d=document.createElement('div'); d.className='gcard';
  d.innerHTML=`<img src="${url}" alt="saved">`;
  d.onclick=()=>{const a=document.createElement('a');a.href=url;a.download='wallify.png';a.click();};
  grid.prepend(d); savedCount++;
}
</script>
</body>
</html>
